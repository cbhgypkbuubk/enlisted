<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: gritty tactical late-night base -->
  <rect width="256" height="256" fill="#1a1c17"/>
  
  <!-- Frayed chain links, descending from top-left, clipped by tag -->
  <g stroke="#8a5a2b" stroke-width="5" fill="none" stroke-linecap="square">
    <polyline points="36,18 52,34 68,26 80,42" />
    <polyline points="80,42 92,58 86,74 100,84" />
    <polyline points="104,20 116,36 110,52 122,64" />
  </g>
  <!-- Chain highlight wear -->
  <g stroke="#c9c2a6" stroke-width="1.5" fill="none" opacity="0.55">
    <polyline points="38,20 50,34 66,28 78,40" />
    <polyline points="82,44 90,58 86,72 98,82" />
  </g>
  
  <!-- Hanging loop / ring connecting chain to tag -->
  <path d="M100 84 L104 106 L122 108 L120 88 Z" fill="#8a5a2b" stroke="#1a1c17" stroke-width="2"/>
  <path d="M106 88 L115 92" stroke="#c9c2a6" stroke-width="2" opacity="0.6"/>
  
  <!-- Dog tag: main outer shape (angled rectangle, top-left notch) -->
  <polygon points="92,104 168,98 190,132 184,210 100,218 82,152" fill="#c9c2a6" stroke="#1a1c17" stroke-width="4" stroke-linejoin="miter"/>
  
  <!-- Inner stamped border inset -->
  <polygon points="100,116 162,111 182,138 177,202 106,209 92,150" fill="none" stroke="#8a5a2b" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Crack split across the tag, jagged -->
  <path d="M162 112 L150 138 L158 146 L138 168 L146 178 L128 196 L118 210" 
        stroke="#1a1c17" stroke-width="3.5" fill="none" stroke-linejoin="miter"/>
  <path d="M162 112 L150 138 L158 146 L138 168 L146 178 L128 196 L118 210" 
        stroke="#8a5a2b" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Crosshair notch cut into lower-right of tag -->
  <g stroke="#1a1c17" stroke-width="3" fill="none">
    <!-- Crosshair circle -->
    <circle cx="154" cy="178" r="16" fill="#1a1c17" stroke="#8a5a2b" stroke-width="2"/>
    <!-- Crosshair ticks -->
    <line x1="154" y1="158" x2="154" y2="166" stroke="#7fd44a"/>
    <line x1="154" y1="190" x2="154" y2="198" stroke="#7fd44a"/>
    <line x1="134" y1="178" x2="142" y2="178" stroke="#7fd44a"/>
    <line x1="166" y1="178" x2="174" y2="178" stroke="#7fd44a"/>
    <!-- Center dot -->
    <circle cx="154" cy="178" r="2.5" fill="#7fd44a" stroke="none"/>
  </g>
  
  <!-- Stencil stamped ID lines on tag (evoking stamped serial, not letters) -->
  <g fill="#8a5a2b" opacity="0.85">
    <rect x="104" y="126" width="34" height="3"/>
    <rect x="104" y="134" width="46" height="3"/>
    <rect x="104" y="142" width="22" height="3"/>
  </g>
  
  <!-- Stenciled chevron mark (military rank-style, not letter) -->
  <g fill="#7fd44a" opacity="0.9">
    <polygon points="112,158 126,168 112,178 106,172 116,168 106,164"/>
  </g>
  
  <!-- Worn texture: scattered scratches and pits on tag -->
  <g stroke="#8a5a2b" stroke-width="1" opacity="0.55">
    <line x1="96" y1="160" x2="104" y2="166"/>
    <line x1="120" y1="200" x2="132" y2="204"/>
    <line x1="140" y1="130" x2="148" y2="134"/>
    <line x1="170" y1="150" x2="176" y2="156"/>
    <line x1="98" y1="186" x2="108" y2="190"/>
  </g>
  <g fill="#1a1c17" opacity="0.35">
    <circle cx="132" cy="152" r="1.5"/>
    <circle cx="168" cy="164" r="1.2"/>
    <circle cx="110" cy="194" r="1.3"/>
    <circle cx="152" cy="196" r="1"/>
  </g>
  
  <!-- Small wordmark, stencil style, bottom-left off-center -->
  <g fill="#c9c2a6" opacity="0.75" transform="translate(24,224) scale(0.9)">
    <rect x="0" y="0" width="6" height="10"/>
    <rect x="0" y="0" width="16" height="2.5"/>
    <rect x="0" y="4" width="13" height="1.5"/>
    <rect x="0" y="7.5" width="11" height="2.5"/>
    <rect x="20" y="0" width="2.5" height="10"/>
    <rect x="20" y="0" width="9" height="2.5"/>
    <rect x="20" y="7.5" width="9" height="2.5"/>
    <rect x="31" y="0" width="2.5" height="10"/>
    <rect x="31" y="7.5" width="8" height="2.5"/>
    <rect x="42" y="0" width="2.5" height="10"/>
    <rect x="42" y="0" width="10" height="2.5"/>
    <rect x="42" y="7.5" width="10" height="2.5"/>
    <rect x="55" y="0" width="2.5" height="10"/>
    <rect x="55" y="0" width="8" height="2.5"/>
    <rect x="55" y="4" width="7" height="1.5"/>
    <rect x="55" y="7.5" width="8" height="2.5"/>
  </g>
  
  <!-- Corner tactical crop marks (off-center composition cue) -->
  <g stroke="#7fd44a" stroke-width="1.5" opacity="0.5">
    <line x1="8" y1="8" x2="28" y2="8"/>
    <line x1="8" y1="8" x2="8" y2="28"/>
    <line x1="248" y1="248" x2="228" y2="248"/>
    <line x1="248" y1="248" x2="248" y2="228"/>
  </g>
</svg>
